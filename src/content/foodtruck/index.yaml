hero:
  headline: Le Food Truck des Fourneaux
  subline: >-
    Gourmand, chaleureux et convivial : le Sud-Ouest s'invite à tous vos
    événements grâce à notre food truck privatisable.
  ctaPrimaryLabel: Privatiser le Food Truck
  ctaPrimaryHref: /contact-infos-et-reservations
  ctaSecondaryLabel: Voir les formules
  ctaSecondaryHref: '#formules'
concept:
  title: |
    Une cuisine nomade, 
  title_highlight: l'esprit du terroir
  description_1: >-
    Apportez de l'originalité et de la convivialité à vos rassemblements. Notre
    food truck se déplace directement sur le lieu de votre événement en
    Île-de-France pour régaler vos convives.
  description_2: >-
    Nous préparons sous vos yeux des recettes inspirées du terroir Français, à
    partir de produits frais, soigneusement sélectionnés. Chaque prestation est
    conçue pour vous
  button_label: Demander un devis
  button_href: /contact-infos-et-reservations
formules:
  badge: Nos menus nomades
  title: Des formules sur mesure
  description: >-
    Chez Les Fourneaux de Laurent, chaque événement mérite son devis
    personnalisé en fonction de vos besoins. Nous n'imposons pas de formules
    figées et concevons ensemble une offre sur mesure pour régaler vos convives.
  cards: []
  button_label: Demander un devis personnalisé
  button_href: /contact-infos-et-reservations
privatisation:
  title: Privatisez pour toutes les occasions
  description: >-
    Que ce soit pour un anniversaire, un rebond de mariage, un événement
    d'entreprise ou un tournoi de rugby, notre food truck s'occupe de tout. Nous
    apportons notre équipement, notre bonne humeur et notre savoir-faire
    culinaire pour faire de votre fête une réussite.
  steps:
    - title: Devis sur-mesure
      description: >-
        Nous évaluons vos besoins en fonction du nombre d'invités et de
        l'emplacement.
    - title: Choix du menu
      description: >-
        Sélectionnez la formule de votre choix ou demandez des ajustements
        personnalisés (options végétariennes disponibles).
    - title: Service clés en main
      description: >-
        Nous installons le food truck, cuisinons en direct et servons vos
        invités dans une ambiance chaleureuse.
final_cta:
  title: Faites vibrer vos invités
  description: >-
    Contactez-nous dès aujourd'hui pour vérifier nos disponibilités et réserver
    le food truck pour votre date.
  button_label: Vérifier les disponibilités
  button_href: /contact-infos-et-reservations
